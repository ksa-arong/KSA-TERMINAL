      description: { key: 'portalSubpage.description.identity' },
      content: `
<section class="portal-content-block id-guide" aria-labelledby="identity-guide-title">

    <button class="id-guide-card" type="button" data-identity-filter="general" aria-pressed="false" aria-controls="identity-guide-table-body">일반인</button>
    <button class="id-guide-card" type="button" data-identity-filter="military" aria-pressed="false" aria-controls="identity-guide-table-body">군인</button>
    <button class="id-guide-card" type="button" data-identity-filter="foreigner" aria-pressed="false" aria-controls="identity-guide-table-body">외국인</button>
    <button class="id-guide-card" type="button" data-identity-filter="youth" aria-pressed="false" aria-controls="identity-guide-table-body">초·중·고·미취학</button>

    <table class="id-guide-matrix">

      <colgroup><col class="id-guide-matrix-target"><col class="id-guide-matrix-accepted"><col class="id-guide-matrix-alternative"></colgroup>
      <thead><tr><th scope="col">대상</th><th scope="col">인정되는 신분증</th><th scope="col">대체 가능한 신분증</th></tr></thead>

        <tr data-identity-row="youth"><th scope="row">초·중·고학생, 미취학아동 등</th><td data-label="인정되는 신분증"><ul><li>①, ③에서 정한 인정범위 전체</li><li class="id-guide-primary">청소년증</li><li>건강보험증</li><li>주민등록표 등본·초본·가족관계증명서</li></ul></td><td data-label="대체 가능한 신분증"><ul><li>학교장이 발급한 신분확인증명서(사진 포함)</li><li>보호자(부모, 친족, 교사 등) 동반 시 보호자 확인(인터뷰 등)으로 인적사항에 대한 신분증으로 갈음(외국인 포함)</li></ul></td></tr>
        <tr data-identity-row="islander"><th scope="row">도서민</th><td data-label="인정되는 신분증"><ul><li class="id-guide-primary">①~④을 적용하되 도서민 운임지원 관리시스템에 사진 정보를 사전에 등록하여 발권 및 승선 시 신원확인이 된 경우 유효한 신분증을 소지한 것으로 간주</li></ul><p class="id-guide-note">* 단, 시스템 불능 등 비상 상황에 대비, 신분증을 항상 휴대하여 발권·승선 단계에서 요구 시 제시 필요</p></td><td data-label="대체 가능한 신분증"><p class="id-guide-note">* 발권 창구 모니터 및 승선 시 스캐너의 사진정보와 대조</p></td></tr>
      </tbody>
    </table>
  </div></section>
`
    };
  </script>
  <script src="../common/dom-utils.js"></script>
  <script src="../common/layout.js"></script>
  <script>
    (function () {
      function initIdentityFilter() {
        const buttons = Array.from(document.querySelectorAll('[data-identity-filter]'));
        const rows = Array.from(document.querySelectorAll('[data-identity-row]'));
        if (!buttons.length || !rows.length) return;
        buttons.forEach(function (button) {
          button.addEventListener('click', function () {
            const target = button.dataset.identityFilter;
            buttons.forEach(function (item) { item.setAttribute('aria-pressed', String(item === button)); });
            rows.forEach(function (row) { row.hidden = target !== 'all' && row.dataset.identityRow !== target; });
          });
        });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initIdentityFilter);
      else initIdentityFilter();
    }());
  </script>

</body>
</html>
