        <details>

        <details>

        </details>
        <details>

            <li><strong>추후결정</strong><span>기상 상황을 더 지켜본 뒤 출항 여부를 결정하는 상태</span></li>
          </ul>
        </details>
        <details>

        </details>
        <details>
          <summary><span class="portal-content-badge">승선</span><span>미성년자는 어떤 확인 서류가 필요한가요?</span></summary>

        </details>

    <section class="portal-faq-panel" id="faq-panel-lost-found" role="tabpanel" aria-labelledby="faq-tab-lost-found" hidden>

          <p>이용한 터미널의 고객안내센터 또는 유실물센터에 문의해 주세요. 터미널별 위치와 연락처는 <a href="lost-found.html">유실물 안내</a>에서 확인할 수 있습니다.</p>
        </details>
        <details>
          <summary><span class="portal-content-badge">유실물</span><span>선박 안에서 잃어버린 물건도 터미널에 문의하나요?</span></summary>
          <p>선박 안에서 분실한 경우에는 이용한 여객선사에 먼저 문의해 주세요. 선박에서 습득된 물품이 터미널로 전달되었을 수 있으므로 터미널 고객안내센터에도 함께 확인하는 것이 좋습니다.</p>
        </details>
        <details>
          <summary><span class="portal-content-badge">유실물</span><span>유실물을 문의할 때 어떤 정보를 알려야 하나요?</span></summary>
          <p>이용 날짜와 시간, 터미널명, 항로와 선박명, 분실 장소, 물품의 종류·색상·특징을 가능한 한 자세히 알려 주세요.</p>
        </details>
        <details>
          <summary><span class="portal-content-badge">유실물</span><span>보관 중인 물건을 찾으려면 무엇이 필요한가요?</span></summary>
          <p>본인 확인이 가능한 신분증을 준비해 주세요. 물품의 특징이나 분실 당시 상황 등 소유자 확인에 필요한 추가 정보를 요청받을 수 있습니다.</p>
        </details>
        <details>
          <summary><span class="portal-content-badge">유실물</span><span>가족이나 대리인이 대신 수령할 수 있나요?</span></summary>
          <p>대리 수령 가능 여부와 필요한 서류는 보관 기관마다 다릅니다. 방문 전에 해당 터미널 유실물센터에 문의해 위임장과 신분증 등 준비 서류를 확인해 주세요.</p>
        </details>
        <details>
          <summary><span class="portal-content-badge">유실물</span><span>유실물은 얼마나 오래 보관하나요?</span></summary>
          <p>보관기간과 이후 처리 절차는 물품 종류와 관리기관 기준에 따라 다릅니다. 귀중품은 일정 기간 후 경찰서로 인계될 수 있으므로 해당 터미널에 보관 상태를 확인해 주세요.</p>
        </details>
        <details>
          <summary><span class="portal-content-badge">유실물</span><span>음식물이나 부패하기 쉬운 물품도 보관하나요?</span></summary>
          <p>음식물처럼 부패·악취·해충 우려가 있는 물품은 일반 물품보다 짧게 보관한 뒤 폐기될 수 있습니다. 발견 즉시 터미널에 문의해 주세요.</p>
        </details>
        <details>
          <summary><span class="portal-content-badge">유실물</span><span>습득한 물건은 어디에 맡기면 되나요?</span></summary>
          <p>가까운 터미널 안내데스크나 고객안내센터에 전달해 주세요. 장소와 시간을 함께 알려 주면 접수와 소유자 확인에 도움이 됩니다.</p>
        </details>
      </div>

    <p class="portal-faq-empty" role="status" hidden>검색 결과가 없습니다.</p>

      const allList = document.querySelector('#faq-panel-all .portal-faq-list');
      const sourceQuestions = document.querySelectorAll('.portal-faq-panel:not(#faq-panel-all) details');
      const tabs = [...document.querySelectorAll('.portal-faq-category')];
      const pageSize = 10;
      let currentPage = 1;
      if (!form || !input || !allList || !pagination || !tabs.length) return;

      function decorateAnswer(question) {
        const answerNodes = [...question.children].filter((node) => node.matches('p, .portal-faq-term-list'));
        if (!answerNodes.length) return;
        const answerBox = document.createElement('div');
        const answerContent = document.createElement('div');
        answerBox.className = 'portal-answer-box portal-faq-answer';
        answerContent.className = 'portal-answer-content';
        answerNodes.forEach((node) => answerContent.appendChild(node));
        answerBox.appendChild(answerContent);
        question.appendChild(answerBox);
      }

      sourceQuestions.forEach((question) => {
        decorateAnswer(question);
        allList.appendChild(question.cloneNode(true));
      });

      function activePanel() {
        const activeTab = tabs.find((tab) => tab.getAttribute('aria-selected') === 'true');
        return activeTab ? document.getElementById(activeTab.getAttribute('aria-controls')) : null;
      }

      function filterQuestions(resetPage = false) {
        if (resetPage) currentPage = 1;
        const query = input.value.trim().toLocaleLowerCase('ko-KR');
        const panel = activePanel();
        if (!panel) return;
        const questions = [...panel.querySelectorAll('details')];
        const matches = questions.filter((item) => {
          const searchableText = [...item.querySelectorAll('summary, .portal-answer-content')]
            .map((node) => node.textContent)
            .join(' ')
            .toLocaleLowerCase('ko-KR');
          return !query || searchableText.includes(query);
        });
        const totalPages = Math.ceil(matches.length / pageSize);
        currentPage = Math.min(Math.max(currentPage, 1), Math.max(totalPages, 1));
        const pageStart = (currentPage - 1) * pageSize;
        const visibleQuestions = new Set(matches.slice(pageStart, pageStart + pageSize));

        questions.forEach((item) => {
          item.hidden = !visibleQuestions.has(item);
          if (item.hidden) item.open = false;
        });
        emptyMessage.hidden = matches.length !== 0;
        window.PortalPagination.renderPagination(pagination, currentPage, totalPages, (page) => {
          currentPage = page;
          filterQuestions();
          activePanel()?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      }

      function activateTab(activeTab, focusTab) {
        tabs.forEach((tab) => {
          const selected = tab === activeTab;
          const panel = document.getElementById(tab.getAttribute('aria-controls'));
          tab.setAttribute('aria-selected', String(selected));
          tab.tabIndex = selected ? 0 : -1;
          if (panel) panel.hidden = !selected;
        });
        filterQuestions(true);
        if (focusTab) activeTab.focus();
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => activateTab(tab, false));
        tab.addEventListener('keydown', (event) => {
          let nextIndex = index;
          if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
          else if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
          else if (event.key === 'Home') nextIndex = 0;
          else if (event.key === 'End') nextIndex = tabs.length - 1;
          else return;
          event.preventDefault();
          activateTab(tabs[nextIndex], true);
        });
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        filterQuestions(true);
      });
      input.addEventListener('input', () => filterQuestions(true));
      filterQuestions(true);
    }());
  </script>
</body>
</html>
