<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="여객선터미널 이용 문의를 확인하고 새로운 문의를 등록할 수 있습니다.">
  <title>문의게시판 | 전국 여객선터미널</title>
  <link rel="stylesheet" href="../common/style.css">
</head>
<body class="portal-page portal-subpage">
  <div id="app"></div>
  <script src="../common/locales/ko.js"></script>
  <script src="../common/locales/en.js"></script>
  <script src="../common/i18n.js"></script>
  <script src="../common/menu-data.js"></script>
  <script src="../common/inquiry-data.js"></script>
  <script>
    window.PORTAL_SUBPAGE_DATA = {
      menuId: 'customer/inquiry',
      rootPrefix: '../',
      description: { key: 'portalSubpage.description.inquiry' },
      content: `
<div class="portal-notice-page portal-inquiry-page">
  <div class="portal-list-toolbar portal-inquiry-toolbar">
    <p class="portal-list-count" id="inquiry-result-status" aria-live="polite" aria-atomic="true">총 <strong id="inquiry-result-count">0</strong>건</p>
  </div>

  <div class="portal-table-wrap portal-notice-table-wrap portal-inquiry-table-wrap">
    <table class="portal-data-table mobile-table--list">
      <caption class="sr-only">고객 문의 목록</caption>
      <colgroup><col style="width: 13%;"><col style="width: 49%;"><col style="width: 13%;"><col style="width: 13%;"><col style="width: 12%;"></colgroup>
      <thead><tr><th scope="col">분류</th><th scope="col">제목</th><th scope="col">작성자</th><th scope="col">등록일</th><th scope="col">답변 상태</th></tr></thead>
      <tbody class="portal-notice-table-body" id="inquiry-list"></tbody>
    </table>
  </div>
  <nav class="portal-pagination" aria-label="문의게시판 페이지" hidden></nav>
  <p class="portal-notice-empty" id="inquiry-empty" role="status" hidden>등록된 문의가 없습니다.</p>
  <div class="portal-inquiry-actions">
    <a class="btn btn--md btn--solid" href="inquiry-write.html">문의 등록</a>
  </div>

  <dialog class="portal-inquiry-auth" id="inquiry-password-dialog" aria-labelledby="inquiry-password-title">
    <button class="btn btn--icon btn--md btn--ghost portal-inquiry-auth-close" id="inquiry-password-close" type="button" aria-label="비밀번호 확인 창 닫기">×</button>
    <div class="portal-inquiry-auth-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg></div>
    <div class="portal-inquiry-auth-copy">
      <h2 id="inquiry-password-title">비밀번호 확인</h2>
      <p>문의글 보호를 위해 비밀번호를 입력해 주세요.</p>
    </div>
    <form class="portal-inquiry-auth-form" id="inquiry-password-form">
      <label class="sr-only" for="inquiry-password">문의글 비밀번호</label>
      <input class="portal-form-control" id="inquiry-password" name="password" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="비밀번호 4자리" required aria-describedby="inquiry-password-error">
      <button class="btn btn--md btn--ghost" type="submit">확인</button>
      <p id="inquiry-password-error" role="alert" hidden>비밀번호가 일치하지 않습니다.</p>
    </form>
    <p class="portal-inquiry-auth-help">등록할 때 입력한 비밀번호를 입력해 주세요. 샘플 문의의 비밀번호는 <strong>0000</strong>입니다.</p>
  </dialog>

  <div class="portal-inquiry-toast" id="inquiry-toast" role="status" aria-live="polite" hidden>문의가 등록되었습니다.</div>
</div>`
    };
  </script>
  <script src="../common/dom-utils.js"></script>
  <script src="../common/layout.js"></script>
  <script src="../common/pagination.js"></script>
  <script>
    (function initializeInquiryPage() {
      const storageKey = 'ksa-terminal-inquiries';
      const count = document.getElementById('inquiry-result-count');
      const list = document.getElementById('inquiry-list');
      const pagination = document.querySelector('.portal-pagination');
      const emptyMessage = document.getElementById('inquiry-empty');
      const toast = document.getElementById('inquiry-toast');
      const passwordDialog = document.getElementById('inquiry-password-dialog');
      const passwordForm = document.getElementById('inquiry-password-form');
      const passwordInput = document.getElementById('inquiry-password');
      const passwordError = document.getElementById('inquiry-password-error');
      const passwordClose = document.getElementById('inquiry-password-close');
      const pageSize = 10;
      let currentPage = 1;
      let pendingInquiryLink = null;
      if (!list || !passwordDialog || !window.PortalPagination) return;

      const escapeHtml = window.PortalDomUtils.escapeHtml;
      function loadLocalItems() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey) || '[]');
          return Array.isArray(saved) ? saved : [];
        } catch (error) {
          return [];
        }
      }
      let inquiries = [...loadLocalItems(), ...(window.PORTAL_INQUIRY_DATA || [])];

      function renderRows(items) {
        list.innerHTML = items.map((item) => {
          const statusClass = item.status === '답변완료' ? ' is-complete' : ' is-waiting';
          const categoryLabel = item.category === '터미널 이용' ? '터미널' : item.category;
          return `<tr><td><span class="portal-content-badge portal-inquiry-category-badge">${escapeHtml(categoryLabel)}</span></td><td class="portal-notice-table-title"><a href="inquiry-detail.html?id=${encodeURIComponent(item.id)}" data-inquiry-id="${escapeHtml(item.id)}">${escapeHtml(item.title)}</a></td><td class="portal-notice-author">${escapeHtml(item.author)}</td><td><time datetime="${escapeHtml(item.date.replaceAll('.', '-'))}">${escapeHtml(item.date)}</time></td><td class="portal-inquiry-status-cell"><span class="portal-inquiry-status-text${statusClass}">${escapeHtml(item.status)}</span></td></tr>`;
        }).join('');
      }

      function openPasswordDialog(link) {
        if (!link) return;
        pendingInquiryLink = link;
        passwordForm.reset();
        passwordError.hidden = true;
        passwordInput.removeAttribute('aria-invalid');
        passwordDialog.showModal();
        passwordInput.focus();
      }

      function closePasswordDialog() {
        passwordDialog.close();
        pendingInquiryLink?.focus();
        pendingInquiryLink = null;
      }

      function filterInquiries(resetPage = false) {
        if (resetPage) currentPage = 1;
        const matches = inquiries;
        const totalPages = Math.ceil(matches.length / pageSize);
        currentPage = Math.min(Math.max(currentPage, 1), Math.max(totalPages, 1));
        renderRows(matches.slice((currentPage - 1) * pageSize, currentPage * pageSize));
        count.textContent = String(matches.length);
        emptyMessage.hidden = matches.length !== 0;
        window.PortalPagination.renderPagination(pagination, currentPage, totalPages, (page) => {
          currentPage = page;
          filterInquiries();
          list.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      }

      list.addEventListener('click', (event) => {
        const link = event.target.closest('[data-inquiry-id]');
        if (!link) return;
        event.preventDefault();
        openPasswordDialog(link);
      });
      passwordForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const inquiryId = pendingInquiryLink?.dataset.inquiryId;
        const inquiry = inquiries.find((item) => String(item.id) === String(inquiryId));
        const expectedPassword = inquiry?.password || '0000';
        if (passwordInput.value !== expectedPassword) {
          passwordError.hidden = false;
          passwordInput.setAttribute('aria-invalid', 'true');
          passwordInput.select();
          return;
        }
        if (!inquiryId) return;
        sessionStorage.setItem('ksa-inquiry-authorized-id', inquiryId);
        window.location.href = pendingInquiryLink.href;
      });
      passwordInput.addEventListener('input', () => {
        passwordError.hidden = true;
        passwordInput.removeAttribute('aria-invalid');
      });
      passwordClose.addEventListener('click', closePasswordDialog);
      passwordDialog.addEventListener('cancel', (event) => {
        event.preventDefault();
        closePasswordDialog();
      });
      passwordDialog.addEventListener('click', (event) => {
        if (event.target !== passwordDialog) return;
        const rect = passwordDialog.getBoundingClientRect();
        const outside = event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom;
        if (outside) closePasswordDialog();
      });
      filterInquiries(true);
      if (new URLSearchParams(window.location.search).get('submitted') === '1') {
        toast.hidden = false;
        setTimeout(() => { toast.hidden = true; }, 3000);
        window.history.replaceState({}, '', 'inquiry.html');
      }
      const unlockId = new URLSearchParams(window.location.search).get('unlock');
      if (unlockId) {
        const unlockLink = list.querySelector(`[data-inquiry-id="${CSS.escape(unlockId)}"]`);
        if (unlockLink) openPasswordDialog(unlockLink);
      }
    }());
  </script>
</body>
</html>
