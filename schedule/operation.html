<!doctype html>
<html lang="ko">

</head>
<body class="portal-page portal-subpage">

  <script src="../common/locales/ko.js"></script>
  <script src="../common/locales/en.js"></script>
  <script src="../common/i18n.js"></script>
  <script src="../common/menu-data.js"></script>
  <script>
    window.PORTAL_SUBPAGE_DATA = {
      menuId: 'schedule/operation-info',
      rootPrefix: '../',
      description: '여객선 출항시각과 선박·항로별 운항 상태를 확인하세요.',

<div class="portal-list-toolbar portal-operation-toolbar" aria-label="운항정보 검색 조건">
  <div class="portal-operation-controls">
    <div class="portal-filter-select-group">
      <div class="portal-list-select">
        <label class="sr-only" for="operation-region-select">지역 구분</label>
        <select id="operation-region-select"></select>
      </div>
      <div class="portal-list-select">
        <label class="sr-only" for="operation-status-select">출항여부</label>
        <select id="operation-status-select"></select>
      </div>
    </div>
    <form class="portal-list-search" id="operation-search-form" role="search">
      <label class="sr-only" for="operation-search-input">선박명 또는 항로 검색</label>
      <input id="operation-search-input" type="search" placeholder="선박명, 항로, 출항지 검색" autocomplete="off">

  </div>
  <div class="portal-operation-result-meta">

  </div>
</div>

<div class="portal-table-wrap portal-operation-table-wrap table-scroll-region" role="region" aria-label="여객선 운항정보 표" tabindex="0">
  <table class="portal-data-table portal-operation-table">
    <caption class="sr-only">지역, 출항지, 출항시각, 여객선명, 운항항로명, 출항여부, 운항구분, 사유별 여객선 운항정보</caption>

      <col class="portal-operation-col-departure">
      <col class="portal-operation-col-time">
      <col class="portal-operation-col-ship">
      <col class="portal-operation-col-route">
      <col class="portal-operation-col-status">
      <col class="portal-operation-col-kind">
      <col class="portal-operation-col-reason">
    </colgroup>
    <thead>
      <tr>
        <th scope="col">지역</th>
        <th scope="col">출항지</th>
        <th scope="col">출항시각</th>
        <th scope="col">여객선명</th>

<nav class="portal-pagination" id="operation-pagination" aria-label="운항정보 페이지" hidden></nav>
