<!doctype html>
<html lang="ko">
<head>

<body class="portal-page portal-subpage">
  <main id="main" class="portal-template-section">

      <div class="portal-content-heading"><h1>운항 정보 페이지가 새 주소로 이동했습니다.</h1><p>잠시 후 새 페이지로 이동합니다.</p></div>
      <div class="portal-preparing-block"><div><span>페이지 이동 안내</span><h2>자동으로 이동하지 않으면 아래 링크를 이용해 주세요.</h2></div><a href="schedule/operation.html">새 페이지로 이동 <i aria-hidden="true">→</i></a></div>
    </div>
  </main>
  <script>
    (function redirectLegacyPage() {
      const routes = {
      '#realtime': 'schedule/operation.html',
      '#planning': 'schedule/operation.html',
      '#cancellation': 'schedule/cancellation.html'
      };
      const target = routes[window.location.hash] || 'schedule/operation.html';
      window.location.replace(target);
    }());
  </script>
